<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAB Info</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="root">
  <div class="app-container m-0 overflow-hidden">
    <div class="tab-bar">
      <button id="tab-btn-info" class="tab-btn active" data-tab="info" onclick="showTab('info')">Info</button>
      <button id="tab-btn-guide" class="tab-btn" data-tab="guide" onclick="showTab('guide')">User Guide</button>
    </div>
    <div id="tab-info" class="tab-content active">
      <div id="error-panel" class="alert alert-danger hidden"></div>
      <div id="warn-panel" class="alert alert-warn hidden"></div>
      <iframe id="about-frame" class="about-frame" title="EAB About" sandbox="allow-scripts"></iframe>
    </div>
    <div id="tab-guide" class="tab-content">
      <div id="guide-status" class="guide-status hidden"></div>
      <iframe id="guide-frame" class="guide-frame hidden" title="EAB User Guide"></iframe>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="ui_helpers.js"></script>
<script src="state.js"></script>
<script src="cli_args.js"></script>
<script src="decoder.js"></script>
<script src="ui.js"></script>
<script src="click_safety.js"></script>
<script src="tooltips.js"></script>
<script src="tab_nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="eab-results.js"></script>
<script>
/* eab-select-keep-focus: keep a combobox focused after a pick so the arrow keys keep changing it. */
document.addEventListener('change', function (event) {
  var el = event.target;
  if (event.isTrusted === false) return;
  if (!el || el.tagName !== 'SELECT' || el.disabled || el.multiple) return;
  var id = el.id;
  setTimeout(function () {
    var target = (id && document.getElementById(id)) || el;
    if (!target.isConnected || target.disabled || document.activeElement === target) return;
    try { target.focus({ preventScroll: true }); } catch (err) { try { target.focus(); } catch (e2) { } }
  }, 0);
}, true);
</script></body>
</html>
